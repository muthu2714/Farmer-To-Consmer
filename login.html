<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriConnect | Login</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-panel auth-visual">
        <div class="auth-overlay-content">
          <span class="eyebrow">Welcome back</span>
          <h1>Fresh agriculture, simpler</h1>
          <p>Access your dashboard to manage products, orders, and farm activity.</p>
        </div>
      </div>
      <div class="auth-panel auth-form-panel">
        <div class="auth-form-wrap">
          <div class="brand auth-brand">
            <div class="brand-mark">A</div>
            <div>
              <span class="brand-name">AgriConnect</span>
            </div>
          </div>
          <h2>Login</h2>
          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" placeholder="Enter your password" required />
            </div>
            <div class="form-group">
              <label for="login-role">Role</label>
              <select id="login-role" name="role">
                <option value="consumer">Consumer</option>
                <option value="farmer">Farmer</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <div id="login-message" class="form-message"></div>
          </form>
          <p class="auth-footer">
            Don’t have an account? <a href="./register.html">Register</a>
          </p>
        </div>
      </div>
    </div>

    <script src="./js/auth.js"></script>
  </body>
</html>
